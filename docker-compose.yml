version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: opporbyte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opporbyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opporbyte_secret}
      POSTGRES_DB: ${POSTGRES_DB:-opporbyte}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opporbyte} -d ${POSTGRES_DB:-opporbyte}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opporbyte-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opporbyte-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-opporbyte}:${POSTGRES_PASSWORD:-opporbyte_secret}@db:5432/${POSTGRES_DB:-opporbyte}
      - SECRET_KEY=${SECRET_KEY:-opporbyte_dev_secret_key_change_in_production_123456789}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - FIRST_USER_EMAIL=${FIRST_USER_EMAIL:-engineer@opporbyte.internal}
      - FIRST_USER_PASSWORD=${FIRST_USER_PASSWORD:-AdminPass123!}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opporbyte-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
